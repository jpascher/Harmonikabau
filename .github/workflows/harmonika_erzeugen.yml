# Harmonika-Modell auf GitHub rechnen lassen (Johann 26.11.2026)
# Bedienung: github.com/jpascher/Harmonikabau -> Actions -> "Harmonika erzeugen" -> "Run workflow" -> Auswahl -> starten.
# Ergebnis nach ca. 15-30 min unter "Releases" (feste Download-Links) und als Artefakt am Lauf.
name: Harmonika erzeugen
run-name: "${{ inputs.teil == 'bass' && format('Bass {0}, Teilung {1}', inputs.bass_variante, inputs.teilung) || format('Diskant {0}, {1}, {2} Knoepfe, Hebel {3} mm', inputs.instrument, inputs.griffstock, inputs.knoepfe, inputs.hebel) }}"

on:
  workflow_dispatch:
    inputs:
      teil:
        description: "Bassteil oder Diskantteil"
        type: choice
        options: [bass, diskant]
        default: bass
      bass_variante:
        description: "Bass: Bassteil"
        type: choice
        options: [markus, marie38, eduard, gerhard, andreas, v340]
        default: markus
      instrument:
        description: "Diskant: Instrument (Markus 3-choerig, Marie 2-choerig)"
        type: choice
        options: [markus, marie]
        default: markus
      griffstock:
        description: "Diskant: Griffstock"
        type: choice
        options: [standard, traditionell, kugellager, kolben, kolben12, winkel, winkel_ital]
        default: standard
      knoepfe:
        description: "Diskant: Knopfzahl (nur Markus)"
        type: choice
        options: ["50", "44", "46", "48", "52", "54"]
        default: "50"
      hebel:
        description: "Diskant: Hebelteilung in mm (10 = 20 mm Knopfabstand, 9 = 18, 8 = 16; nur Markus, Winkel immer 10)"
        type: choice
        options: ["10", "9", "8"]
        default: "10"
      platten:
        description: "Diskant: eigene Stimmplattenlaengen in mm, leer = wie gezeichnet. Form: R1: 32 33 34 ...; R2: 29 31 ... (Anzahl je Reihe = Klappen der Reihe)"
        type: string
        default: ""
      teilung:
        description: "Bass: Knopfteilung in mm (standard = Wert der Zeichnung)"
        type: choice
        options: [standard, "18", "19", "20"]
        default: standard
      laenge:
        description: "Bass: Gehaeuselaenge Markus-Bass in mm (Diskantlaenge genuegt, wird auf 10 mm aufgerundet)"
        type: string
        default: "380"
      vorschau:
        description: "Vorschau (GLB + Bild) erzeugen"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  erzeugen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: markus-3d
      - name: Auswahl pruefen
        if: inputs.teil == 'diskant'
        env:
          PLATTEN: ${{ inputs.platten }}
        run: python3 markus-3d/ci/tastenliste_bauen.py "${{ inputs.instrument }}" "${{ inputs.griffstock }}" "${{ inputs.knoepfe }}" "${{ inputs.hebel }}" /tmp/pruef_liste.txt "$PLATTEN"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: markus-3d/ci/requirements.txt
      - name: Systempakete
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libglx-mesa0 libxrender1 zip
      - name: Python-Pakete
        run: pip install -q -r markus-3d/ci/requirements.txt
      - name: Modell rechnen
        env:
          PYVISTA_OFF_SCREEN: "true"
          PLATTEN: ${{ inputs.platten }}
        run: |
          V="${{ inputs.teil == 'bass' && inputs.bass_variante || format('{0}:{1}:{2}:{3}', inputs.instrument, inputs.griffstock, inputs.knoepfe, inputs.hebel) }}"
          xvfb-run -a python3 markus-3d/ci/erzeuge_ci.py "${{ inputs.teil }}" "$V" "${{ inputs.teilung }}" "${{ inputs.laenge }}" ergebnis "${{ inputs.vorschau }}"
      - name: Protokoll bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protokoll-${{ github.run_number }}
          path: ergebnis/protokoll.txt
          if-no-files-found: ignore
      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.run_number }}
          path: ergebnis/
          retention-days: 30
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: "${{ inputs.teil == 'bass' && format('Bass {0}, Teilung {1}', inputs.bass_variante, inputs.teilung) || format('Diskant {0}, {1}, {2} Knoepfe, Hebel {3} mm', inputs.instrument, inputs.griffstock, inputs.knoepfe, inputs.hebel) }}"
        run: |
          V="${{ inputs.teil == 'bass' && inputs.bass_variante || format('{0}:{1}:{2}:{3}', inputs.instrument, inputs.griffstock, inputs.knoepfe, inputs.hebel) }}"
          gh release create "modell-${{ github.run_number }}" ergebnis/* \
            --title "$TITEL (Lauf ${{ github.run_number }})" \
            --notes-file ergebnis/notizen.md
