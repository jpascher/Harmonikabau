name: Modell rechnen lassen
description: Bass- oder Diskantteil der Steirischen Harmonika rechnen lassen (STEP-Modell, Fräsdaten, Vorschau)
title: "Modell-Anfrage"
labels: ["modell-anfrage"]
body:
  - type: markdown
    attributes:
      value: |
        Wähle das Teil und die Ausführung. Nach dem Absenden wird die Auswahl geprüft; gerechnet wird, sobald die Anfrage freigegeben ist (Anfragen des Repo-Besitzers sofort). Das Ergebnis kommt nach etwa 15–30 Minuten als Antwort mit Download-Link. Erklärung aller Felder: https://jpascher.github.io/Harmonikabau/docs/hilfe.html
  - type: dropdown
    id: teil
    attributes:
      label: Teil
      options: [bass, diskant]
    validations:
      required: true
  - type: dropdown
    id: bass_variante
    attributes:
      label: "Bass: Bassteil"
      description: Nur wenn Teil = bass
      options: [markus, marie38, eduard, gerhard, andreas, v340]
  - type: dropdown
    id: teilung
    attributes:
      label: "Bass: Knopfteilung"
      options: [standard, "18", "19", "20"]
  - type: input
    id: laenge
    attributes:
      label: "Bass: Gehäuselänge (nur Markus-Bass, mm)"
      placeholder: "380"
  - type: textarea
    id: belegung
    attributes:
      label: "Bass: Belegung (nur v340)"
      description: Kurzform von der Seite „Bassbelegung zuordnen“ einfügen; leer = wie gebaut
      placeholder: "1.1=V077, 1.2=BL152, ..."
  - type: dropdown
    id: instrument
    attributes:
      label: "Diskant: Instrument"
      description: Nur wenn Teil = diskant. Markus 3-chörig, Marie 2-chörig
      options: [markus, marie]
  - type: dropdown
    id: griffstock
    attributes:
      label: "Diskant: Griffstock"
      options: [standard, traditionell, kugellager, kolben, kolben12, winkel, winkel_ital]
  - type: dropdown
    id: knoepfe
    attributes:
      label: "Diskant: Knopfzahl"
      options: ["50", "44", "46", "48", "52", "54"]
  - type: dropdown
    id: hebel
    attributes:
      label: "Diskant: Hebelteilung (mm)"
      description: 10 = 20 mm Knopfabstand, 9 = 18 mm, 8 = 16 mm
      options: ["10", "9", "8"]
  - type: textarea
    id: platten
    attributes:
      label: "Diskant: Stimmplattenlängen"
      description: Leer = wie gezeichnet. Form R1 32 33 34 ...; R2 ... (je Reihe so viele Werte wie Klappen)
      placeholder: "R1: 32 33 34 37 40 43 45 47 48 49 49 40 40"
  - type: dropdown
    id: vorschau
    attributes:
      label: Vorschau erzeugen
      options: ["ja", "nein"]
